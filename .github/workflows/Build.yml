name: UnrealEngine Build and Archive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
      # Step 1: Cache the repository
      - name: Cache repository
        uses: actions/cache@v3
        id: cache-repo
        with:
          path: |
            .git
            **/submodules
          key: ${{ runner.os }}-repo-${{ hashFiles('**/*', '**/.*') }}
          restore-keys: |
            ${{ runner.os }}-repo-

      # Step 2: Checkout repository with submodules and depth 1
      - name: Checkout repository
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Step 3: Save repository cache
      - name: Save repository cache
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/cache@v3
        with:
          path: |
            .git
            **/submodules
          key: ${{ runner.os }}-repo-${{ hashFiles('**/*', '**/.*') }}

      # Step 4: Download Visual Studio 2017 Community Edition
      - name: Download Visual Studio 2017 Community Edition
        shell: bash
        run: |
          mkdir -p /c/tmp
          curl -L -o /c/tmp/vs_community.exe https://aka.ms/vs/15/release/vs_community.exe

      # Step 5: Install Visual Studio 2017 Community Edition
      - name: Install Visual Studio 2017 Community Edition
        shell: powershell
        run: |
          $Dest = "C:\\tmp\\vs_community.exe"
          $Params = @(
              "--add Microsoft.VisualStudio.Workload.NativeDesktop", # Desktop development with C++
              "--add Microsoft.VisualStudio.Component.Windows81SDK", # Windows 8.1 SDK
              "--add Microsoft.VisualStudio.Workload.ManagedDesktop", # .NET desktop development
              "--add Microsoft.VisualStudio.Workload.Universal", # Universal Windows Platform Development
              "--add Microsoft.VisualStudio.Component.Windows10SDK.17763", # Win10 SDK 17763
              "--add Microsoft.VisualStudio.ComponentGroup.UCRT", # UCRT SDK
              "--add Microsoft.VisualStudio.Workload.NativeGame", # Game development with C++
              "--add Microsoft.Component.MSBuild", # MSBuild
              "--add Microsoft.VisualStudio.Component.NuGet", # NuGet Package Manager
              "--quiet",
              "--wait"
          )
          Start-Process -FilePath $Dest -ArgumentList ($Params -join " ") -Wait
          Remove-Item $Dest

      # Step 6: Cache Setup.bat results
      - name: Cache Setup
        uses: actions/cache@v3
        id: cache-setup
        with:
          path: ./.setup_cache
          key: ${{ runner.os }}-setup-${{ hashFiles('Setup.bat') }}
          restore-keys: |
            ${{ runner.os }}-setup-

      # Step 6.1: Run Setup.bat if cache is not found
      - name: Run Setup.bat
        if: steps.cache-setup.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmd /c ".\Setup.bat"
        timeout-minutes: 20
        continue-on-error: true

      # Step 6.2: Save Setup.bat results to cache
      - name: Save Setup Cache
        if: steps.cache-setup.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.setup_cache
          # Save necessary files or directories to the cache
          # Example: cp -r path/to/files ./.setup_cache

      # Step 7: Run GenerateProjectFiles.bat
      - name: Run GenerateProjectFiles.bat
        shell: cmd
        run: |
          cd ${{ github.workspace }}
          .\GenerateProjectFiles.bat -2017

      # Step 8: Build Unreal Engine Editor
      - name: Build Unreal Engine Editor
        shell: powershell
        run: |
          $SolutionPath = "${{ github.workspace }}\UE4.sln"
          $Configuration = "Development Editor"
          $Platform = "Win64"
          $vswherePath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          & $vswherePath $SolutionPath /p:Configuration="$Configuration" /p:Platform="$Platform" /m
        timeout-minutes: 240

      # Step 9: Compress the installed engine into a .7z file
      - name: Compress Installed Engine
        shell: cmd
        run: 7z a InstalledEngine.7z LocalBuilds\Engine

      # Step 10: Upload the .7z file as an artifact
      - name: Upload Installed Engine Archive
        uses: actions/upload-artifact@v3
        with:
          name: InstalledEngine
          path: InstalledEngine.7z
