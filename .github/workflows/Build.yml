name: UnrealEngine Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
      # Step 1: Cache the repository
      - name: Cache repository
        id: cache-repo
        uses: actions/cache@v4
        with:
          path: |
            .git
            **/submodules
          key: windows-repo-cache

      # Step 2: Checkout repository if cache is not found
      - name: Checkout repository
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Step 3: Cache Setup.bat results
      - name: Cache Setup
        id: cache-setup
        uses: actions/cache@v4
        with:
          path: ./.setup_cache
          key: windows-setup-cache

      # Step 4: Run Setup.bat if cache is not found
      - name: Run Setup.bat
        if: steps.cache-setup.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmd /c ".\Setup.bat"
          
