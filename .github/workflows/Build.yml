name: UnrealEngine Build and Archive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019

    steps:
    # Step 1: Checkout repository with submodules and depth 1
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # Step 2: Download and install Visual Studio 2017 Build Tools
    - name: Download Visual Studio 2017 Build Tools
      shell: bash
      run: |
        mkdir -p /c/tmp
        curl -L -o /c/tmp/vs_buildtools.exe https://aka.ms/vs/15/release/vs_buildtools.exe

    - name: Install Visual Studio 2017 Build Tools
      shell: powershell
      run: |
        $Dest = "C:\\tmp\\vs_buildtools.exe"
        $Params = @(
            "--add Microsoft.VisualStudio.Workload.NativeDesktop", # Desktop development with C++
            "--add Microsoft.VisualStudio.Workload.ManagedDesktop", # .NET desktop development
            "--add Microsoft.VisualStudio.Workload.Universal", # Universal Windows Platform Development
            "--add Microsoft.VisualStudio.Component.Windows10SDK.17763", # Win10 SDK 17763
            "--add Microsoft.VisualStudio.Component.Windows10SDK.17134", # Win10 SDK 17134
            "--add Microsoft.VisualStudio.Component.Windows10SDK.16299", # Win10 SDK 16299
            "--add Microsoft.VisualStudio.Component.Windows81SDK", # Windows 8.1 SDK
            "--add Microsoft.VisualStudio.ComponentGroup.UCRT", # UCRT SDK
            "--add Microsoft.VisualStudio.Workload.NativeGame", # Game development with C++
            "--quiet",
            "--wait"
        )
        Start-Process -FilePath $Dest -ArgumentList ($Params -join " ") -Wait
        Remove-Item $Dest

    # Step 3: Run Setup.bat
    - name: Run Setup.bat
      run: |
        cmd /c ".\Setup.bat"
      shell: cmd
      timeout-minutes: 20
      continue-on-error: true

    # Step 4: Run GenerateProjectFiles.bat
    - name: Run GenerateProjectFiles.bat
      run: |
        cd ${{ github.workspace }}
        .\GenerateProjectFiles.bat -2017
      shell: cmd

    # Step 5: Build Unreal Engine Editor
    - name: Build Unreal Engine Editor
      shell: powershell
      run: |
        $SolutionPath = "${{ github.workspace }}\UE4.sln"
        $Configuration = "Development Editor"
        $Platform = "Win64"
        & "C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools\MSBuild\15.0\Bin\MSBuild.exe" `
          $SolutionPath /p:Configuration="$Configuration" /p:Platform="$Platform" /m
      timeout-minutes: 120

    # Step 6: Install 7-Zip
    - name: Install 7-Zip
      run: choco install 7zip -y
      shell: powershell

    # Step 7: Compress the installed engine into a .7z file
    - name: Compress Installed Engine
      shell: cmd
      run: 7z a InstalledEngine.7z LocalBuilds\Engine

    # Step 8: Upload the .7z file as an artifact
    - name: Upload Installed Engine Archive
      uses: actions/upload-artifact@v3
      with:
        name: InstalledEngine
        path: InstalledEngine.7z
